spring:
  application:
    name: voca
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      show-components: always

# JWT secret never has a real value here; supply via JWT_SECRET env or application-local.yml.
# Empty value triggers IllegalStateException at boot via JwtTokenProvider#init.
jwt:
  secret: "${JWT_SECRET:}"
  access-token-validity-ms: 3600000          # 1 hour
  refresh-token-validity-ms: 1209600000      # 14 days

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    org.hibernate.SQL: debug
